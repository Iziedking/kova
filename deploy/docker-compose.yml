# KOVA backend for the VPS.
#
# INGRESS IS NOT OURS. This project has no Caddy of its own: the ArcRun/Agon
# compose project owns ports 80 and 443 on this host, and KOVA borrows it the
# same way Agent QA, Avow and sFace do. The backend joins that project's
# default network under a fixed container name, and the `api.kova.surf` site
# block lives in the Agon repository at deploy/caddy/Caddyfile.
#
# Two consequences, both inherited from that arrangement:
#
#   1. The site block must live in Agon's tracked source. Its deploy workflow
#      runs `git reset --hard origin/main` on /opt/arcrun, so a block added by
#      hand on the VPS survives only until the next Agon push.
#   2. Never run `docker compose down` in the Agon directory: it deletes the
#      shared network and takes this service down with it. Use `up -d` or
#      restart individual services.
#
# Caddy does not watch its config, so after changing the site block:
#   docker exec arcrun-caddy caddy reload --config /etc/caddy/Caddyfile

services:
  postgres:
    image: postgres:16.15-alpine3.24@sha256:3c5c8892d184f738f4fe282d14ddaa613a38f00f4189d2d94725ebe6f2909ddb
    restart: unless-stopped
    environment:
      POSTGRES_DB: kova
      POSTGRES_USER: kova
      POSTGRES_PASSWORD: ${KOVA_POSTGRES_PASSWORD:?KOVA_POSTGRES_PASSWORD is required}
    volumes:
      - kova-postgres-data:/var/lib/postgresql/data
    networks:
      - kova-private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    restart: "no"
    environment:
      KOVA_DATABASE_URL: postgresql://kova:${KOVA_POSTGRES_PASSWORD}@postgres:5432/kova
    command: ["npm", "run", "db:migrate"]
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - kova-private
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    # Fixed name because Agon's Caddy addresses this container by name.
    container_name: kova-api
    restart: unless-stopped
    init: true
    stop_grace_period: 35s
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    cpus: 1.0
    environment:
      # These names must match src/backend/config.ts exactly. They were FLOAT_*
      # before the rename; a mismatch does not fail loudly, it silently falls
      # back to defaults, which means fixture mode and localhost-only CORS.
      KOVA_BACKEND_HOST: 0.0.0.0
      KOVA_BACKEND_PORT: 8787
      KOVA_ALLOWED_ORIGINS: ${KOVA_ALLOWED_ORIGINS:?KOVA_ALLOWED_ORIGINS is required}
      # Preview mode is intentionally useful without an RPC. Empty means every
      # finalized read stays unavailable instead of falling back to a provider.
      KOVA_SOLANA_RPC_URL: ${KOVA_SOLANA_RPC_URL:-}
      KOVA_DATABASE_URL: postgresql://kova:${KOVA_POSTGRES_PASSWORD}@postgres:5432/kova
      KOVA_RECONCILIATION_INTERVAL_SECONDS: ${KOVA_RECONCILIATION_INTERVAL_SECONDS:-300}
      KOVA_GAME_ENABLED: ${KOVA_GAME_ENABLED:-false}
      KOVA_ANSEM_MINT: ${KOVA_ANSEM_MINT:-}
      PRIVY_APP_ID: ${PRIVY_APP_ID:-}
      PRIVY_APP_SECRET: ${PRIVY_APP_SECRET:-}
      KOVA_PICK_KEY_ID: ${KOVA_PICK_KEY_ID:-}
      KOVA_PICK_ENCRYPTION_KEY: ${KOVA_PICK_ENCRYPTION_KEY:-}
      KOVA_PICK_PREVIOUS_ENCRYPTION_KEYS: ${KOVA_PICK_PREVIOUS_ENCRYPTION_KEYS:-}
    # No published ports. Reachable only over the shared network, through Caddy.
    expose:
      - "8787"
    networks:
      - kova-private
      - agon-edge
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/ready').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  kova-postgres-data:

networks:
  # Postgres is unreachable from the shared network.
  kova-private:
    internal: true
  # The ArcRun/Agon compose project's default network, created by that project.
  # It must already exist; this project never creates or removes it.
  agon-edge:
    external: true
    name: deploy_default
