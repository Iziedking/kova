[package]
name = "kova-chip-v3"
description = "CHIP v3: a NEP-141 coin with no premine. It is minted only by mining (the emission and the Motherlode) and by the testnet starter claim, and it is burned by every mine."
version = "0.1.0"
edition = "2024"
resolver = "3"
rust-version = "1.95"
# NEP-0330: exposed through the `contract_source_metadata` view.
repository = "https://github.com/Iziedking/kova"

# Built with cargo-near and kept out of the Anchor workspace at the repo root.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.22.0-rust-1.99.1"
image_digest = "sha256:c9655eaf7436b90c87ea8b25739f91063032c5c30ba24cfeafe72c142943b5bb"
passed_env = []
container_build_command = [
    "cargo",
    "near",
    "build",
    "non-reproducible-wasm",
    "--locked",
]

[dependencies]
near-sdk = "=5.30.1"
near-contract-standards = "=5.30.1"

[dev-dependencies]
near-sdk = { version = "=5.30.1", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(near)']
