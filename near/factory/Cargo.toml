[package]
name = "kova-factory"
description = "The Kova factory: opens one mine per coin, as a keyless account that runs one immutable global contract by hash. It accepts CHIP, a fixed list of coins, and coins launched on meme.cooking. It has no admin."
version = "0.1.0"
edition = "2024"
resolver = "3"
rust-version = "1.95"
# NEP-0330: exposed through the `contract_source_metadata` view.
repository = "https://github.com/Iziedking/kova"

# Built with cargo-near and kept out of the Anchor workspace at the repo root.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.22.0-rust-1.99.1"
image_digest = "sha256:c9655eaf7436b90c87ea8b25739f91063032c5c30ba24cfeafe72c142943b5bb"
passed_env = []
container_build_command = [
    "cargo",
    "near",
    "build",
    "non-reproducible-wasm",
    "--locked",
]

[dependencies]
near-sdk = "=5.30.1"

[dev-dependencies]
near-sdk = { version = "=5.30.1", features = ["unit-testing"] }
near-sandbox = "=0.4.0"
near-api = "=0.8.7"
cargo-near-build = "=0.11.5"
tokio = { version = "=1.54.1", features = ["full"] }
testresult = "=0.4.2"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(near)']
